services:
  # ── Backend: FastAPI ──────────────────────────────────────────────
  - type: web
    name: autochad-api
    runtime: python
    plan: free
    rootDir: AutoCHAD/backend
    pythonVersion: "3.11.0"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ── Frontend: React/Vite static site ─────────────────────────────
  - type: web
    name: autochad
    env: static
    plan: free
    rootDir: AutoCHAD
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
